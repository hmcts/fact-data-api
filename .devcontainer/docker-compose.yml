services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/fact-data-api:cached
      # Retains user-scoped GitHub CLI, Copilot CLI, and JetBrains backend settings
      # when IntelliJ recreates the dev container. No credentials are stored in Git.
      - devcontainer-home:/home/vscode
      # Docker Desktop's host SSH agent; private SSH keys remain on macOS.
      - /run/host-services/ssh-auth.sock:/ssh-agent
    env_file:
      - ../.env
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      # Override the read-only host Git config inside this container only.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: tag.gpgsign
      GIT_CONFIG_VALUE_1: "false"
      DB_HOST: fact-database
      DB_PORT: 5432
      DB_NAME: fact
      DB_USER: fact
      DB_PASSWORD: fact
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_MANAGED_IDENTITY_ENABLED: "false"
      TESTING_SUPPORT_ENABLE_API: "true"
      RUN_DB_MIGRATION_ON_STARTUP: "true"
    depends_on:
      fact-database:
        condition: service_healthy
      fact-storage-init:
        condition: service_completed_successfully

  fact-database:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: fact
      POSTGRES_USER: fact
      POSTGRES_PASSWORD: fact
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fact -d fact"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  fact-storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    env_file:
      - ../.env
    volumes:
      - azurite-data:/data

  fact-storage-init:
    image: mcr.microsoft.com/azure-cli
    depends_on:
      fact-storage:
        condition: service_started
    env_file:
      - ../.env
    command:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          if az storage container create --name photos --connection-string "$$DOCKER_AZURE_STORAGE_CONNECTION_STRING" --only-show-errors --output none \
            && az storage container create --name csv --connection-string "$$DOCKER_AZURE_STORAGE_CONNECTION_STRING" --only-show-errors --output none; then
            echo "Created Azurite containers: photos, csv"
            exit 0
          fi
          echo "Waiting for Azurite to become ready..."
          sleep 2
        done
        echo "Failed to create Azurite containers"
        exit 1

volumes:
  devcontainer-home:
  db-data:
  azurite-data:
