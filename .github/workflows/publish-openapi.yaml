name: Publish OpenAPI specs
on:
  push:
    branches:
      - "master"

jobs:
  publish-openapi:
    permissions:
      contents: read
    uses: hmcts/workflow-publish-openapi-spec/.github/workflows/publish-openapi.yml@45f26330b1307afead070a83322e175a25e40170
    secrets:
      SWAGGER_PUBLISHER_API_TOKEN: ${{ secrets.SWAGGER_PUBLISHER_API_TOKEN }}
    with:
      test_to_run: 'uk.gov.hmcts.reform.fact.data.api.openapi.OpenAPIPublisherTest'
      java_version: 21
      api_name: 'fact-data-api'
  publish-openapi-apim:
    needs: publish-openapi
    permissions:
      contents: read
    uses: hmcts/workflow-publish-openapi-spec/.github/workflows/publish-openapi.yml@45f26330b1307afead070a83322e175a25e40170
    secrets:
      SWAGGER_PUBLISHER_API_TOKEN: ${{ secrets.SWAGGER_PUBLISHER_API_TOKEN }}
    with:
      test_to_run: 'uk.gov.hmcts.reform.fact.data.api.openapi.OpenAPIPublisherApimTest'
      java_version: 21
      api_name: 'fact-data-api-apim'
