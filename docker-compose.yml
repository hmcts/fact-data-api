# Note to security: This is not used in any environment, only locally for development purposes.
# Create a local .env file (see README) before running Docker Compose.
services:
  fact-data-api:
    build: .
    ports:
      - "8989:8989"
    depends_on:
      fact-database:
        condition: service_healthy
      fact-storage-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: fact-database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fact}
      DB_USER: ${DB_USER:-fact}
      DB_PASSWORD: ${DB_PASSWORD:-fact}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      APP_REG_ID: ${APP_REG_ID:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-devstoreaccount1}
      AZURE_STORAGE_CONNECTION_STRING: ${DOCKER_AZURE_STORAGE_CONNECTION_STRING}
      AZURE_MANAGED_IDENTITY_ENABLED: ${AZURE_MANAGED_IDENTITY_ENABLED:-false}
      TESTING_SUPPORT_ENABLE_API: ${TESTING_SUPPORT_ENABLE_API:-true}
      RUN_DB_MIGRATION_ON_STARTUP: ${RUN_DB_MIGRATION_ON_STARTUP:-true}
      OS_KEY: ${OS_KEY:-}
  fact-database:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_DB: ${DB_NAME:-fact}
      POSTGRES_USER: ${DB_USER:-fact}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fact}
    ports:
      - "5999:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
  fact-storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNTS}
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
  fact-storage-init:
    image: mcr.microsoft.com/azure-cli@sha256:e3768dde8142efa45d8f356a317aaac77abd7da15ba3719b0a150e9453f251db
    depends_on:
      fact-storage:
        condition: service_started
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${DOCKER_AZURE_STORAGE_CONNECTION_STRING}
    command:
      - /bin/sh
      - -c
      - |
        for i in $(seq 1 30); do
          if az storage container create --name photos --connection-string "$$AZURE_STORAGE_CONNECTION_STRING" --only-show-errors --output none \
            && az storage container create --name csv --connection-string "$$AZURE_STORAGE_CONNECTION_STRING" --only-show-errors --output none; then
            echo "Created Azurite containers: photos, csv"
            exit 0
          fi
          echo "Waiting for Azurite to become ready..."
          sleep 2
        done
        echo "Failed to create Azurite containers"
        exit 1
volumes:
  db-data:
  azurite-data:
